[project]
name = "backend"
version = "0.1.0"
description = "Personal Finance Backend API"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "numpy>=2.3.5",
    "paddleocr<3.0",
    "paddlepaddle-gpu>=2.6.2",
    "pandas>=3.0.6",
    "prophet>=1.4.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "setuptools>=75.0,<81",
    "sqlalchemy>=2.0.0",
    "statsmodels>=0.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

